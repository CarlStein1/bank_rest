databaseChangeLog:
  - changeSet:
      id: 003-create-cards
      author: CarlStein1

      changes:
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id_card
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cards
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: number_encrypted
                  type: VARBINARY(64)
                  constraints:
                    nullable: false

              - column:
                  name: number_iv
                  type: BINARY(12)
                  constraints:
                    nullable: false

              - column:
                  name: number_last_four
                  type: CHAR(4)
                  constraints:
                    nullable: false

              - column:
                  name: encryption_key_version
                  type: SMALLINT
                  constraints:
                    nullable: false

              - column:
                  name: expiration_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: card_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: cards
            indexName: idx_cards_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: cards
            indexName: idx_cards_card_status
            columns:
              - column:
                  name: card_status

        - addForeignKeyConstraint:
            constraintName: fk_cards_user
            baseTableName: cards
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id_user
            onDelete: RESTRICT
            onUpdate: CASCADE

      rollback:
        - dropTable:
            tableName: cards