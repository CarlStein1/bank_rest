databaseChangeLog:
  - changeSet:
      id: 002-create-users
      author: CarlStein1

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id_user
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: middle_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: true

              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: login
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_users_login

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: users