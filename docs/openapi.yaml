openapi: 3.1.0
info:
  title: Bank Card Management API
  description: |
    REST API для управления банковскими картами,
    пользователями, запросами на блокировку
    и переводами между собственными картами.
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Карты
  description: "Создание, управление и просмотр банковских карт"
- name: Авторизация
  description: Аутентификация пользователей и получение JWT-токена
- name: Переводы
  description: Переводы денежных средств между собственными картами
- name: Пользователи
  description: Управление пользователями администратором
- name: Заявки на блокировку карт
  description: |
    Создание заявок пользователями
    и обработка заявок администраторами
paths:
  /api/admin/users/{userId}:
    get:
      tags:
      - Пользователи
      summary: Получить пользователя
      description: Возвращает пользователя по его идентификатору
      operationId: getUserById
      parameters:
      - name: userId
        in: path
        description: Идентификатор пользователя
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Пользователь найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Недостаточно прав для выполнения операции
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Пользователи
      summary: Обновить пользователя
      description: Изменяет данные существующего пользователя
      operationId: updateUser
      parameters:
      - name: userId
        in: path
        description: Идентификатор пользователя
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: Данные пользователя успешно обновлены
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Переданы некорректные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Новый логин уже занят
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Пользователи
      summary: Удалить пользователя
      description: Удаляет пользователя по его идентификатору
      operationId: deleteUser
      parameters:
      - name: userId
        in: path
        description: Идентификатор пользователя
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Пользователь успешно удалён
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Пользователь не может быть удалён из-за связанных данных
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/transfers:
    post:
      tags:
      - Переводы
      summary: Перевести средства между своими картами
      description: |
        Выполняет перевод между двумя картами,
        принадлежащими текущему авторизованному пользователю.
      operationId: transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "200":
          description: Перевод успешно выполнен
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "400":
          description: Некорректная сумма или выбрана одна и та же карта
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "401":
          description: Пользователь не авторизован
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "403":
          description: Одна из карт принадлежит другому пользователю
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "404":
          description: Одна из карт не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "409":
          description: |
            Недостаточно средств, карта заблокирована
            или срок её действия истёк
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
      security:
      - bearerAuth: []
  /api/cards/{cardId}/block-requests:
    post:
      tags:
      - Заявки на блокировку карт
      summary: Создать заявку на блокировку карты
      description: |
        Создаёт заявку на блокировку карты,
        принадлежащей текущему пользователю.
      operationId: createBlockRequest
      parameters:
      - name: cardId
        in: path
        description: Идентификатор карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardBlockRequest"
        required: true
      responses:
        "201":
          description: Заявка успешно создана
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "400":
          description: Переданы некорректные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "401":
          description: Пользователь не авторизован
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "403":
          description: Карта принадлежит другому пользователю
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "404":
          description: Карта не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "409":
          description: |
            Карта уже заблокирована
            или активная заявка уже существует
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
      security:
      - bearerAuth: []
  /api/auth/login:
    post:
      tags:
      - Авторизация
      summary: Авторизация пользователя
      description: |
        Проверяет логин и пароль пользователя.
        При успешной авторизации возвращает JWT-токен
        и информацию об авторизованном пользователе.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Авторизация выполнена успешно
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Некорректные входные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Неверный логин или пароль
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/admin/users:
    get:
      tags:
      - Пользователи
      summary: Получить список пользователей
      description: Возвращает страницу пользователей с поддержкой пагинации и сортировки
      operationId: getAllUsers
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Список пользователей успешно получен
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelUserResponse"
        "403":
          description: Недостаточно прав для выполнения операции
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Пользователи
      summary: Создать пользователя
      description: Создаёт нового пользователя с ролью USER или ADMIN
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Пользователь успешно создан
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Переданы некорректные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Недостаточно прав для выполнения операции
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Пользователь с таким логином уже существует
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/admin/users/{userId}/cards:
    post:
      tags:
      - Карты
      summary: Создать карту
      description: Создаёт новую банковскую карту для указанного пользователя
      operationId: createCard
      parameters:
      - name: userId
        in: path
        description: Идентификатор владельца карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "201":
          description: Карта успешно создана
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
      security:
      - bearerAuth: []
  /api/admin/cards/{cardId}/block:
    patch:
      tags:
      - Карты
      summary: Заблокировать карту
      description: Блокирует выбранную банковскую карту
      operationId: blockCard
      parameters:
      - name: cardId
        in: path
        description: Идентификатор карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Карта успешно заблокирована
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "404":
          description: Карта не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
      security:
      - bearerAuth: []
  /api/admin/cards/{cardId}/activate:
    patch:
      tags:
      - Карты
      summary: Активировать карту
      description: Активирует выбранную банковскую карту
      operationId: activateCard
      parameters:
      - name: cardId
        in: path
        description: Идентификатор карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Карта успешно активирована
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "404":
          description: Карта не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
      security:
      - bearerAuth: []
  /api/admin/block-requests/{requestId}/reject:
    patch:
      tags:
      - Заявки на блокировку карт
      summary: Отклонить заявку
      description: |
        Отклоняет заявку на блокировку.
        Статус карты при этом не изменяется.
      operationId: rejectBlockRequest
      parameters:
      - name: requestId
        in: path
        description: Идентификатор заявки
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessCardBlockRequest"
        required: true
      responses:
        "200":
          description: Заявка успешно отклонена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "400":
          description: Переданы некорректные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "404":
          description: Заявка не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "409":
          description: Заявка уже была обработана
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
      security:
      - bearerAuth: []
  /api/admin/block-requests/{requestId}/approve:
    patch:
      tags:
      - Заявки на блокировку карт
      summary: Подтвердить заявку
      description: |
        Подтверждает заявку и блокирует связанную с ней карту.
      operationId: approveBlockRequest
      parameters:
      - name: requestId
        in: path
        description: Идентификатор заявки
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessCardBlockRequest"
        required: true
      responses:
        "200":
          description: "Заявка подтверждена, карта заблокирована"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "400":
          description: Переданы некорректные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "404":
          description: Заявка не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "409":
          description: Заявка уже была обработана
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
      security:
      - bearerAuth: []
  /api/cards:
    get:
      tags:
      - Карты
      summary: Получить свои карты
      description: |
        Возвращает страницу банковских карт,
        принадлежащих текущему авторизованному пользователю.
      operationId: getMyCards
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Страница карт успешно получена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCardResponse"
        "401":
          description: Пользователь не авторизован
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCardResponse"
      security:
      - bearerAuth: []
  /api/cards/{cardId}:
    get:
      tags:
      - Карты
      summary: Получить свою карту
      description: |
        Возвращает карту только в том случае,
        если она принадлежит текущему пользователю.
      operationId: getMyCard
      parameters:
      - name: cardId
        in: path
        description: Идентификатор карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Карта успешно получена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "401":
          description: Пользователь не авторизован
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "403":
          description: Нет доступа к чужой карте
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "404":
          description: Карта не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
      security:
      - bearerAuth: []
  /api/cards/{cardId}/balance:
    get:
      tags:
      - Карты
      summary: Получить баланс своей карты
      description: |
        Возвращает баланс карты только в том случае,
        если она принадлежит текущему пользователю.
      operationId: getMyCardBalance
      parameters:
      - name: cardId
        in: path
        description: Идентификатор карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Баланс успешно получен
          content:
            '*/*':
              schema:
                type: number
        "401":
          description: Пользователь не авторизован
          content:
            '*/*':
              schema:
                type: number
        "403":
          description: Нет доступа к чужой карте
          content:
            '*/*':
              schema:
                type: number
        "404":
          description: Карта не найдена
          content:
            '*/*':
              schema:
                type: number
      security:
      - bearerAuth: []
  /api/admin/cards:
    get:
      tags:
      - Карты
      summary: Получить все карты
      description: Возвращает страницу всех банковских карт
      operationId: getAllCards
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Страница карт успешно получена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCardResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCardResponse"
      security:
      - bearerAuth: []
  /api/admin/cards/{cardId}:
    get:
      tags:
      - Карты
      summary: Получить карту
      description: Возвращает банковскую карту по её идентификатору
      operationId: getCardById
      parameters:
      - name: cardId
        in: path
        description: Идентификатор карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Карта успешно получена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "404":
          description: Карта не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Карты
      summary: Удалить карту
      description: Удаляет банковскую карту по её идентификатору
      operationId: deleteCard
      parameters:
      - name: cardId
        in: path
        description: Идентификатор карты
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Карта успешно удалена
        "403":
          description: Недостаточно прав
        "404":
          description: Карта не найдена
      security:
      - bearerAuth: []
  /api/admin/block-requests:
    get:
      tags:
      - Заявки на блокировку карт
      summary: Получить заявки на блокировку
      description: |
        Возвращает страницу заявок на блокировку карт.
        Поддерживает фильтрацию по статусу и пагинацию.
      operationId: getAllBlockRequests
      parameters:
      - name: status
        in: query
        description: Статус заявки
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        example: PENDING
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Страница заявок успешно получена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCardBlockRequestResponse"
        "401":
          description: Пользователь не авторизован
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCardBlockRequestResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCardBlockRequestResponse"
      security:
      - bearerAuth: []
  /api/admin/block-requests/{requestId}:
    get:
      tags:
      - Заявки на блокировку карт
      summary: Получить заявку
      description: Возвращает заявку на блокировку по идентификатору
      operationId: getBlockRequestById
      parameters:
      - name: requestId
        in: path
        description: Идентификатор заявки
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Заявка успешно получена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
        "404":
          description: Заявка не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardBlockRequestResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    UpdateUserRequest:
      type: object
      description: Данные для обновления пользователя
      properties:
        firstName:
          type: string
          description: Новое имя пользователя
          example: Иван
          maxLength: 50
          minLength: 0
        middleName:
          type: string
          description: Новое отчество пользователя
          example: Иванович
          maxLength: 50
          minLength: 0
        lastName:
          type: string
          description: Новая фамилия пользователя
          example: Иванов
          maxLength: 50
          minLength: 0
        role:
          type: string
          description: Новая роль пользователя
          enum:
          - ADMIN
          - USER
          example: USER
      required:
      - firstName
      - lastName
      - role
    ApiErrorResponse:
      type: object
      description: Возникновение ошибки при запросе на сервер
      properties:
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки
        status:
          type: integer
          format: int32
          description: Статус ошибки
          example: 404
        error:
          type: string
          description: Наименование ошибки
          example: Not Found
        message:
          type: string
          description: Сообщение для пользователя
          example: Карта с идентификатором 15 не найдена
        path:
          type: string
          description: Путь HTTP-запроса
          example: /api/cards/15
    UserResponse:
      type: object
      description: Информация о пользователе
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор пользователя
          example: 1
        firstName:
          type: string
          description: Имя пользователя
          example: Иван
        middleName:
          type: string
          description: Отчество пользователя
          example: Иванович
        lastName:
          type: string
          description: Фамилия пользователя
          example: Иванов
        login:
          type: string
          description: Логин пользователя
          example: ivanov
        role:
          type: string
          description: Роль пользователя
          enum:
          - ADMIN
          - USER
          example: USER
    TransferRequest:
      type: object
      description: Данные для перевода между своими картами
      properties:
        fromCardId:
          type: integer
          format: int64
          description: Идентификатор карты списания
          example: 1
        toCardId:
          type: integer
          format: int64
          description: Идентификатор карты зачисления
          example: 2
        amount:
          type: number
          description: Сумма перевода
          example: 500.0
          minimum: 0.01
      required:
      - amount
      - fromCardId
      - toCardId
    TransferResponse:
      type: object
      description: Результат перевода между картами
      properties:
        fromCardId:
          type: integer
          format: int64
          description: Идентификатор карты списания
          example: 1
        toCardId:
          type: integer
          format: int64
          description: Идентификатор карты зачисления
          example: 2
        amount:
          type: number
          description: Сумма перевода
          example: 500.0
        fromCardBalance:
          type: number
          description: Баланс карты списания после перевода
          example: 1500.0
        toCardBalance:
          type: number
          description: Баланс карты зачисления после перевода
          example: 3000.0
    CreateCardBlockRequest:
      type: object
      description: Данные для создания заявки на блокировку карты
      properties:
        reason:
          type: string
          description: Причина блокировки карты
          example: Карта была потеряна
          maxLength: 500
          minLength: 0
    CardBlockRequestResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cardId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
        processedById:
          type: integer
          format: int64
        adminComment:
          type: string
    LoginRequest:
      type: object
      description: Данные для авторизации
      properties:
        login:
          type: string
          description: Логин пользователя
          example: ivanov
          maxLength: 50
          minLength: 3
        password:
          type: string
          description: Пароль пользователя
          example: StrongPass123
          maxLength: 100
          minLength: 8
      required:
      - login
      - password
    AuthResponse:
      type: object
      description: Результат успешной авторизации
      properties:
        token:
          type: string
          description: JWT-токен доступа
        user:
          $ref: "#/components/schemas/UserResponse"
          description: Данные авторизованного пользователя
    CreateUserRequest:
      type: object
      description: Данные для создания пользователя
      properties:
        firstName:
          type: string
          description: Имя пользователя
          example: Иван
          maxLength: 50
          minLength: 0
        middleName:
          type: string
          description: Отчество пользователя
          example: Иванович
          maxLength: 50
          minLength: 0
        lastName:
          type: string
          description: Фамилия пользователя
          example: Иванов
          maxLength: 50
          minLength: 0
        login:
          type: string
          description: Логин пользователя
          example: ivanov
          maxLength: 50
          minLength: 3
        password:
          type: string
          description: Пароль пользователя
          example: Password123
          maxLength: 100
          minLength: 8
        role:
          type: string
          description: Роль пользователя
          enum:
          - ADMIN
          - USER
          example: USER
      required:
      - firstName
      - lastName
      - login
      - password
      - role
    CardResponse:
      type: object
      description: Информация о банковской карте
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор карты
          example: 10
        userId:
          type: integer
          format: int64
          description: Идентификатор владельца карты
          example: 1
        maskedNumber:
          type: string
          description: Маскированный номер карты
          example: '**** **** **** 1234'
        expirationDate:
          type: string
          format: date
          description: Срок действия карты
          example: 2031-07-31
        status:
          type: string
          description: Статус карты
          enum:
          - ACTIVE
          - BLOCKED
          - EXPIRED
          example: ACTIVE
        balance:
          type: number
          description: Баланс карты
          example: 12500.5
    ProcessCardBlockRequest:
      type: object
      description: Комментарий при обработке заявки на блокировку
      properties:
        adminComment:
          type: string
          description: Комментарий администратора
          example: "Заявка одобрена, карта заблокирована"
          maxLength: 500
          minLength: 0
    PageCardResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/CardResponse"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelCardBlockRequestResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/CardBlockRequestResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT access-токен для авторизации
      scheme: bearer
      bearerFormat: JWT
